<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calligraphy Prompts</title>
    <!-- Fonts: Great Vibes for handwritten, Outfit for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="app-container">
        <header>
            <h1 class="handwritten-title">What would you like to write today?</h1>
        </header>

        <section class="controls glass-panel">
            <div class="control-group">
                <label for="mood-select">Mood & Theme</label>
                <div class="select-wrapper">
                    <select id="mood-select">
                        <option value="Any">Surprise Me</option>
                        <option value="Happy">Happy & Joyful</option>
                        <option value="Spiritual">Spiritual & Divine</option>
                        <option value="Motivational">Motivational</option>
                        <option value="Provoking">Thought Provoking</option>
                        <option value="Poetry">Poetry</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label for="word-count">Length: <span id="word-count-display">5</span> words</label>
                <div class="slider-wrapper">
                    <input type="range" id="word-count" min="1" max="10" value="5">
                    <small class="slider-hint">Select exactly 1-10 words</small>
                </div>
            </div>

            <button id="generate-btn" class="primary-btn">
                <span>Inspire Me</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </button>
        </section>

        <section class="result-area">
            <div id="quote-card" class="quote-card glass-panel hidden">
                <div class="quote-content">
                    <p id="quote-text" class="quote-text"></p>
                    <div class="quote-meta">
                        <span id="quote-author" class="quote-author"></span>
                        <span id="quote-mood" class="quote-badge"></span>
                    </div>
                </div>
                <div class="actions">
                    <button id="copy-btn" class="icon-btn" aria-label="Copy to clipboard" title="Copy to clipboard">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
            </div>
            
            <div id="empty-state" class="empty-state">
                <p>Select your preferences and tap "Inspire Me" to reveal your next masterpiece.</p>
            </div>
        </section>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
